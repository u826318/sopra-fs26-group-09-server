server.port=8080

# Receipt images are validated by ReceiptUploadService at 5 MB. Spring's
# multipart parser must allow the request through before that validation runs.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Enabling the H2-Console (local and remote)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# File-backed H2 keeps users, households, and pantry items across backend restarts.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/virtual-pantry;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# You can find your h2-console at: http://localhost:8080/h2-console/
# If you changed the server.port, you must also change it in the URL
# The credentials to log in to the h2 Driver are defined above. Be aware that the h2-console is only accessible when the server is running.
openai.api-key=${OPENAI_API_KEY:}
openai.model=gpt-4o-mini